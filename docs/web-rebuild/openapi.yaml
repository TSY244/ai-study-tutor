components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 一次用户意图的 UUID；相同请求重复提交返回首次结果。
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CourseId:
      name: course_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lesson_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuizId:
      name: quiz_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: question_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaudeKeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ck_[0-9a-f]+$'

  headers:
    RequestId:
      description: 请求关联 ID；所有成功和错误响应都由 HTTP middleware 返回。
      required: true
      schema:
        type: string

  responses:
    Problem:
      description: Problem Details 错误
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: 必需依赖不可用
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AsyncAccepted:
      description: 后台任务已创建
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Location:
          description: Job 资源地址
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AsyncAccepted"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean

    SystemStatus:
      type: object
      additionalProperties: false
      required: [status, version, maintenance, database, worker, claude, storage]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        version:
          type: string
        maintenance:
          $ref: "#/components/schemas/MaintenanceStatus"
        database:
          $ref: "#/components/schemas/ComponentStatus"
        worker:
          $ref: "#/components/schemas/ComponentStatus"
        claude:
          $ref: "#/components/schemas/ComponentStatus"
        storage:
          $ref: "#/components/schemas/ComponentStatus"

    ComponentStatus:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable, unknown]
        message:
          type: [string, "null"]

    MaintenanceStatus:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
        reason:
          type: [string, "null"]

    ClaudeKey:
      description: Claude 网关密钥的安全视图；绝不包含完整 api_key。
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - masked_key
        - fingerprint
        - model
        - enabled
        - priority
        - weight
        - timeout_seconds
        - cooldown_seconds
        - max_consecutive_failures
        - status
        - consecutive_failures
        - last_error_code
        - last_success_at
        - last_failure_at
        - cooldown_until
        - last_latency_ms
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        masked_key:
          type: string
          description: 脱敏展示形式（如 sk-ant-...WXYZ）；无法反推完整 Key。
        fingerprint:
          type: string
          description: "Key 的短指纹（sha256: 前缀），用于区分密钥而不泄露内容。"
        model:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
        weight:
          type: integer
          minimum: 1
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        cooldown_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 100
        status:
          type: string
          enum: [unknown, healthy, cooling_down, auth_failed, disabled, testing]
        consecutive_failures:
          type: integer
          minimum: 0
        last_error_code:
          type: [string, "null"]
        last_success_at:
          type: [string, "null"]
          format: date-time
        last_failure_at:
          type: [string, "null"]
          format: date-time
        cooldown_until:
          type: [string, "null"]
          format: date-time
        last_latency_ms:
          type: [integer, "null"]
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClaudeKeyList:
      type: object
      additionalProperties: false
      required: [items, routing, legacy_fallback, write_enabled]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClaudeKey"
        routing:
          type: string
          enum: [priority_failover]
        legacy_fallback:
          type: boolean
          description: keys.json 无启用 Key 且 Worker 仍通过旧 ANTHROPIC_API_KEY_FILE 单 Key 工作时为 true。
        write_enabled:
          type: boolean

    ClaudeKeyCreate:
      type: object
      additionalProperties: false
      required: [api_key, name, model]
      properties:
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: 完整 Anthropic API Key；仅用于写入，任何响应都不会回读。
        name:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 0
          default: 10
        weight:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 300
        cooldown_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 100
          default: 2

    ClaudeKeyUpdate:
      description: 全部字段可选；省略 api_key 表示保留原 Key，提供则替换。
      type: object
      additionalProperties: false
      properties:
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: 提供时替换完整 Key；任何响应都不会回读。
        name:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
        weight:
          type: integer
          minimum: 1
          maximum: 1000
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        cooldown_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 100

    ClaudeCodeSettingsSaved:
      description: Claude Code 设置已从指定已保存 Key 覆盖写入的安全确认。
      type: object
      additionalProperties: false
      required: [status, target]
      properties:
        status:
          type: string
          enum: [saved]
        target:
          type: string
          enum: ["~/.claude/settings.json"]

    BilibiliCookieUpsert:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: Netscape Cookie 导出内容、Cookie 头串（SESSDATA=xxx; ...）或单个 SESSDATA 值；仅用于写入，任何响应都不会回读。

    BilibiliCookieStatus:
      description: B 站 Cookie 的安全视图；绝不包含完整 Cookie。
      type: object
      additionalProperties: false
      required: [configured, updated_at, sessdata_expires_at, expired, masked_sessdata, cookie_count]
      properties:
        configured:
          type: boolean
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Cookie 文件最后保存时间；未配置时为 null。
        sessdata_expires_at:
          type: [string, "null"]
          format: date-time
          description: SESSDATA 本地有效期；会话级（无 expires）时为 null。
        expired:
          type: boolean
          description: SESSDATA 是否已超过本地有效期（以 B 站实际登录状态为准，检测任务可确认）。
        masked_sessdata:
          type: string
          description: 脱敏 SESSDATA（前 7 位 + 后 4 位）；未配置时为空串。
        cookie_count:
          type: integer
          minimum: 0
          description: 保存的 bilibili.com 域名 Cookie 条目数。

    CourseCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000

    CourseUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        archived:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1

    Course:
      type: object
      additionalProperties: false
      required: [id, title, description, archived, lesson_count, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        archived:
          type: boolean
        lesson_count:
          type: integer
          minimum: 0
        version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourseList:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    LessonStatus:
      type: string
      enum: [draft, processing, ready, failed, ready_with_warning]

    LessonCreate:
      type: object
      additionalProperties: false
      required: [ordinal, title]
      properties:
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000

    LessonUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        version:
          type: integer
          format: int64
          minimum: 1

    DocumentAvailability:
      type: object
      additionalProperties: false
      required: [raw_text, student_notes, teacher_outline]
      properties:
        raw_text:
          type: boolean
        student_notes:
          type: boolean
        teacher_outline:
          type: boolean

    Lesson:
      type: object
      additionalProperties: false
      required: [id, course_id, ordinal, title, description, status, documents, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        ordinal:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/LessonStatus"
        active_job_id:
          type: [string, "null"]
          format: uuid
        documents:
          $ref: "#/components/schemas/DocumentAvailability"
        mastery:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        version:
          type: integer
          format: int64
        created_at:
          type: string
