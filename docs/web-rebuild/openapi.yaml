openapi: 3.1.0
info:
  title: AI Study Tutor API
  version: 0.3.0-draft
  description: |
    单用户本地部署的 AI 学习助教 REST/SSE 契约草案。
    耗时操作返回 202 和 Job；错误使用 application/problem+json。
servers:
  - url: /
    description: Caddy 同源反向代理
x-common-response-headers:
  X-Request-ID:
    $ref: "#/components/headers/RequestId"
x-generation-rules:
  common-response-headers: >-
    发布前必须把 x-common-response-headers 展开到 api/openapi.yaml 的每一个
    成功和错误 Response；CI 对展开产物逐响应校验，代码生成不得直接读取本设计源。
tags:
  - name: System
  - name: Courses
  - name: Lessons
  - name: Materials
  - name: Documents
  - name: Quizzes
  - name: Attempts
  - name: Jobs
  - name: Weaknesses
  - name: Summaries
  - name: Progress
  - name: Exports
  - name: Files
  - name: Backups

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: 进程存活检查
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 服务就绪检查
      responses:
        "200":
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: 查询非敏感系统状态
      responses:
        "200":
          description: 系统状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/system/claude-tests:
    post:
      tags: [System]
      operationId: createClaudeConnectivityTest
      summary: 创建 Claude 连通性测试任务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/system/claude-keys:
    get:
      tags: [System]
      operationId: listClaudeKeys
      summary: 查询 Claude 网关密钥列表（安全视图，绝不含完整 Key）
      responses:
        "200":
          description: Claude 网关密钥列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeKeyList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [System]
      operationId: createClaudeKey
      summary: 创建 Claude 网关密钥
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeKeyCreate"
      responses:
        "201":
          description: Claude 网关密钥已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeKey"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/system/claude-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ClaudeKeyId"
    patch:
      tags: [System]
      operationId: updateClaudeKey
      summary: 更新 Claude 网关密钥（省略 api_key 表示保留原 Key）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeKeyUpdate"
      responses:
        "200":
          description: Claude 网关密钥已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeKey"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [System]
      operationId: deleteClaudeKey
      summary: 删除 Claude 网关密钥
      responses:
        "204":
          description: 已删除
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/system/claude-keys/{key_id}/test:
    parameters:
      - $ref: "#/components/parameters/ClaudeKeyId"
    post:
      tags: [System]
      operationId: createClaudeKeyTest
      summary: 创建单个 Claude 网关密钥的连通性测试任务（Worker 后台执行）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/system/claude-keys/{key_id}/claude-code-settings:
    parameters:
      - $ref: "#/components/parameters/ClaudeKeyId"
    post:
      tags: [System]
      operationId: saveClaudeKeyToClaudeCodeSettings
      summary: 将指定 Claude Key 应用到运行环境的 Claude Code 设置
      responses:
        "200":
          description: Claude Code 设置已应用到运行环境；响应绝不包含完整 Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeCodeSettingsSaved"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/system/bilibili-cookie:
    get:
      tags: [System]
      operationId: getBilibiliCookieStatus
      summary: 查询 B 站 Cookie 状态（安全视图，绝不含完整 Cookie）
      responses:
        "200":
          description: B 站 Cookie 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BilibiliCookieStatus"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [System]
      operationId: saveBilibiliCookie
      summary: 保存 B 站 Cookie（Netscape 导出内容、Cookie 头串或 SESSDATA；仅保留 bilibili.com 条目）
      description: PUT 天然幂等（相同内容重复保存结果一致，写盘原子），不要求 Idempotency-Key。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BilibiliCookieUpsert"
      responses:
        "200":
          description: B 站 Cookie 已保存；响应为安全视图，绝不回读完整 Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BilibiliCookieStatus"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [System]
      operationId: deleteBilibiliCookie
      summary: 删除已保存的 B 站 Cookie
      responses:
        "204":
          description: 已删除
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/system/bilibili-cookie/tests:
    post:
      tags: [System]
      operationId: createBilibiliCookieTest
      summary: 创建 B 站 Cookie 可用性检测任务（Worker 后台执行）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/system/bilibili-cookie/logins:
    post:
      tags:
      - System
      operationId: createBilibiliLogin
      summary: 创建 B 站扫码登录会话（Worker 执行）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/AsyncAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/system/bilibili-cookie/logins/{login_id}/poll:
    post:
      tags:
      - System
      operationId: pollBilibiliLogin
      summary: 查询扫码状态并在确认后自动保存 Cookie
      parameters:
      - name: login_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 扫码登录安全视图，响应不缓存，不包含完整 Cookie
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BilibiliLoginStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: 查询课程列表
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: archived
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: 课程列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Courses]
      operationId: createCourse
      summary: 创建课程
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
      responses:
        "201":
          description: 课程已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/courses:batch-delete:
    post:
      tags:
      - Courses
      operationId: batchDeleteCourses
      summary: 批量删除课程（原子：任一课程不存在或有进行中任务则整体回滚）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDelete'
      responses:
        '204':
          description: 已全部删除
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/courses/{course_id}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Courses]
      operationId: getCourse
      summary: 查询课程详情
      responses:
        "200":
          description: 课程详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Courses]
      operationId: updateCourse
      summary: 更新课程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: 课程已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Courses]
      operationId: deleteCourse
      summary: 删除课程
      responses:
        "204":
          description: 已删除
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/courses/{course_id}/knowledge-points:
    get:
      tags:
      - Courses
      operationId: listCourseKnowledgePoints
      summary: 查看课程知识点及原文依据
      parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: lesson_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 最新成功分析的课程知识点，可按课时过滤
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePointCollection'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/courses/{course_id}/lessons:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Lessons]
      operationId: listLessons
      summary: 查询课程下的课时
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 课时列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Lessons]
      operationId: createLesson
      summary: 创建空课时
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonCreate"
      responses:
        "201":
          description: 课时已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}:
    parameters:
    - $ref: '#/components/parameters/LessonId'
    get:
      tags:
      - Lessons
      operationId: getLesson
      summary: 查询课时详情
      responses:
        '200':
          description: 课时详情
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Lessons
      operationId: updateLesson
      summary: 更新课时
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdate'
      responses:
        '200':
          description: 课时已更新
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Lessons
      operationId: deleteLesson
      summary: 删除课时及全部关联内容
      description: 级联删除素材、文档、知识点、测验、作答、总结及课时薄弱点，并重新计算课程进度；仅有进行中任务时拒绝。
      responses:
        '204':
          description: 已删除
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/lessons:batch-delete:
    post:
      tags:
      - Lessons
      operationId: batchDeleteLessons
      summary: 批量级联删除课时（原子：任一课时不存在或有进行中任务则整体回滚）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDelete'
      responses:
        '204':
          description: 已全部删除
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/lessons/{lesson_id}/materials/url:
    post:
      tags: [Materials]
      operationId: createUrlMaterial
      summary: 添加 URL 素材并创建导入任务
      parameters:
        - $ref: "#/components/parameters/LessonId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrlMaterialCreate"
      responses:
        "202":
          description: 素材和任务已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialJobAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}/materials/text:
    post:
      tags: [Materials]
      operationId: createTextMaterial
      summary: 添加文本素材并创建导入任务
      parameters:
        - $ref: "#/components/parameters/LessonId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextMaterialCreate"
      responses:
        "202":
          description: 素材和任务已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialJobAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}/materials/upload:
    post:
      tags: [Materials]
      operationId: uploadMaterial
      summary: 上传文件素材并创建导入任务
      description: 支持图片（PNG/JPEG/WebP/TIFF/BMP/GIF）、PDF（含扫描页 OCR）、PPTX（幻灯片文字、备注、图表、图片 OCR）、DOCX、文本及音视频。PDF/PPTX 最多 300 页。音频 MP3/WAV/M4A/FLAC/OGG/OPUS/AAC 使用 transcription_mode=whisper_local。所有来源先提取原文，再生成 AI 笔记和教纲。批量导入逐文件创建课时并调用本接口，每个课时的上传使用独立 Idempotency-Key。
      parameters:
        - $ref: "#/components/parameters/LessonId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                preferred_language:
                  type: string
                  description: 音频识别语言，如 zh、en；留空时自动识别。
                transcription_mode:
                  type: string
                  enum: [subtitle_only, whisper_local]
      responses:
        "202":
          description: 上传完成，导入任务已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialJobAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}/documents:
    get:
      tags: [Documents]
      operationId: listCurrentDocuments
      summary: 查询课时当前文档
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200":
          description: 当前文档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummaryCollection"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}/documents/{kind}:
    get:
      tags:
      - Documents
      operationId: getCurrentDocument
      summary: 查询指定类型的当前文档
      parameters:
      - $ref: '#/components/parameters/LessonId'
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DocumentKind'
      responses:
        '200':
          description: 当前文档
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Documents
      operationId: createManualDocument
      summary: 手工新增课时文档
      parameters:
      - $ref: '#/components/parameters/LessonId'
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - raw_text
          - student_notes
          - teacher_outline
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 手工新增课时文档
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Problem'
      description: 该类型已有当前文档时返回 409；支持原文、学生笔记和教师大纲。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
    put:
      tags:
      - Documents
      operationId: updateManualDocument
      summary: 编辑文档并发布新版本
      parameters:
      - $ref: '#/components/parameters/LessonId'
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - raw_text
          - student_notes
          - teacher_outline
      responses:
        '200':
          description: 编辑文档并发布新版本
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Problem'
      description: expected_revision 必须等于当前版本。旧版本保留；修改原文会停用旧知识点。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
  /api/v1/lessons/{lesson_id}/regenerations:
    post:
      tags: [Documents]
      operationId: createLessonRegeneration
      summary: 创建笔记重生成任务
      parameters:
        - $ref: "#/components/parameters/LessonId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerationCreate"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}/quiz-generations:
    post:
      tags: [Quizzes]
      operationId: createQuizGeneration
      summary: 创建常规试卷生成任务
      parameters:
        - $ref: "#/components/parameters/LessonId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizGenerationCreate"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}/review-quiz-generations:
    post:
      tags: [Quizzes]
      operationId: createReviewQuizGeneration
      summary: 创建复习试卷生成任务
      parameters:
        - $ref: "#/components/parameters/LessonId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewQuizGenerationCreate"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}/quizzes:
    get:
      tags:
      - Quizzes
      operationId: listQuizzes
      summary: 查询课时试卷
