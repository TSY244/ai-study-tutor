              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryEvaluationAccepted'
        default:
          $ref: '#/components/responses/Problem'
      description: 保留旧总结及其评估结果，返回新 evaluation.id 和评估任务；有活动任务时返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryEvaluationCreate'
    delete:
      tags:
      - Summaries
      operationId: deleteSummaryEvaluation
      summary: 删除学习总结评估
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: 删除学习总结评估
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/lessons/{lesson_id}/exports:
    post:
      tags: [Exports]
      operationId: createLessonExport
      summary: 创建课时导出
      parameters:
        - $ref: "#/components/parameters/LessonId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreate"
      responses:
        "200":
          description: 小型导出已同步完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
        "202":
          $ref: "#/components/responses/AsyncAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/files/{file_id}/download:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: 下载已发布文件
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 文件内容
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/backups:
    get:
      tags: [Backups]
      operationId: listBackups
      summary: 查询备份包
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 备份列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/lessons/{lesson_id}/knowledge-points:
    post:
      tags:
      - Courses
      operationId: createKnowledgePoint
      summary: 新增课时知识点
      parameters:
      - $ref: '#/components/parameters/LessonId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 新增课时知识点
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePoint'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgePointCreate'
  /api/v1/knowledge-points/{knowledge_point_id}:
    get:
      tags:
      - Courses
      operationId: getKnowledgePoint
      summary: 查询单个知识点
      parameters:
      - name: knowledge_point_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 查询单个知识点
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePoint'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Courses
      operationId: updateKnowledgePoint
      summary: 修改知识点
      parameters:
      - name: knowledge_point_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 修改知识点
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePoint'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgePointUpdate'
    delete:
      tags:
      - Courses
      operationId: deleteKnowledgePoint
      summary: 删除知识点
      parameters:
      - name: knowledge_point_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: 删除知识点
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Problem'
      description: 历史试卷中的知识点快照保留。
  /api/v1/quizzes/{quiz_id}/editor:
    get:
      tags:
      - Quizzes
      operationId: getQuizEditor
      summary: 读取测验编辑内容（含参考答案）
      parameters:
      - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: 读取测验编辑内容（含参考答案）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizEditor'
        default:
          $ref: '#/components/responses/Problem'
      description: 内容管理专用表示，含标准答案与解析。学生 GET /quizzes/{quiz_id} 的答案隐藏规则不变。
  /api/v1/courses/{course_id}/weaknesses:
    post:
      tags:
      - Weaknesses
      operationId: createWeakness
      summary: 手工新增薄弱点
      parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 手工新增薄弱点
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weakness'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeaknessCreate'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 一次用户意图的 UUID；相同请求重复提交返回首次结果。
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CourseId:
      name: course_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lesson_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuizId:
      name: quiz_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: question_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaudeKeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ck_[0-9a-f]+$'

  headers:
    RequestId:
      description: 请求关联 ID；所有成功和错误响应都由 HTTP middleware 返回。
      required: true
      schema:
        type: string

  responses:
    Problem:
      description: Problem Details 错误
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: 必需依赖不可用
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AsyncAccepted:
      description: 后台任务已创建
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Location:
          description: Job 资源地址
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AsyncAccepted"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean

    SystemStatus:
      type: object
      additionalProperties: false
      required: [status, version, maintenance, database, worker, claude, storage]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        version:
          type: string
        maintenance:
          $ref: "#/components/schemas/MaintenanceStatus"
        database:
          $ref: "#/components/schemas/ComponentStatus"
        worker:
          $ref: "#/components/schemas/ComponentStatus"
        claude:
          $ref: "#/components/schemas/ComponentStatus"
        storage:
          $ref: "#/components/schemas/ComponentStatus"

    ComponentStatus:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable, unknown]
        message:
          type: [string, "null"]

    MaintenanceStatus:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
        reason:
          type: [string, "null"]

    GatewayProtocol:
      type: string
      enum:
      - anthropic
      - openai
      description: Anthropic Messages 或 OpenAI Chat Completions 兼容协议；旧配置默认为 Anthropic。
    ClaudeKey:
      description: Claude 网关密钥的安全视图；绝不包含完整 api_key。
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - masked_key
      - fingerprint
      - model
      - protocol
      - enabled
      - priority
      - weight
      - timeout_seconds
      - cooldown_seconds
      - max_consecutive_failures
      - status
      - consecutive_failures
      - last_error_code
      - last_success_at
      - last_failure_at
      - cooldown_until
      - last_latency_ms
      - created_at
      - updated_at
      properties:
        protocol:
          $ref: '#/components/schemas/GatewayProtocol'
        id:
          type: string
        name:
          type: string
        masked_key:
          type: string
          description: 脱敏展示形式（如 sk-ant-...WXYZ）；无法反推完整 Key。
        fingerprint:
          type: string
          description: 'Key 的短指纹（sha256: 前缀），用于区分密钥而不泄露内容。'
        model:
          type: string
        base_url:
          type: string
          description: 该 Key 专属的 API base URL；留空时 Anthropic 使用部署默认值，OpenAI 使用 https://api.openai.com/v1。
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
        weight:
          type: integer
          minimum: 1
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        cooldown_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 100
        status:
          type: string
          enum:
          - unknown
          - healthy
          - cooling_down
          - auth_failed
          - quota_exhausted
          - disabled
          - testing
        consecutive_failures:
          type: integer
          minimum: 0
        last_error_code:
          type:
          - string
          - 'null'
        last_success_at:
          type:
          - string
          - 'null'
          format: date-time
        last_failure_at:
          type:
          - string
          - 'null'
          format: date-time
        cooldown_until:
          type:
          - string
          - 'null'
          format: date-time
        last_latency_ms:
          type:
          - integer
          - 'null'
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClaudeKeyList:
      type: object
      additionalProperties: false
      required: [items, routing, legacy_fallback, write_enabled]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClaudeKey"
        routing:
          type: string
          enum: [priority_failover]
        legacy_fallback:
          type: boolean
          description: keys.json 无启用 Key 且 Worker 仍通过旧 ANTHROPIC_API_KEY_FILE 单 Key 工作时为 true。
        write_enabled:
          type: boolean

    ClaudeKeyCreate:
      type: object
      additionalProperties: false
      required:
      - api_key
      - name
      - model
      properties:
        protocol:
          $ref: '#/components/schemas/GatewayProtocol'
          default: anthropic
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: 完整模型 API Key；仅用于写入，任何响应都不会回读。
        name:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        base_url:
          type: string
          description: 可选；非空必须是 https URL（无 userinfo），存储时去尾 /。
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 0
          default: 10
        weight:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 300
        cooldown_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 100
          default: 2
    ClaudeKeyUpdate:
      description: 全部字段可选；省略 api_key 表示保留原 Key，提供则替换。
      type: object
      additionalProperties: false
      properties:
        protocol:
          $ref: '#/components/schemas/GatewayProtocol'
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: 提供时替换完整 Key；任何响应都不会回读。
        name:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        base_url:
          type: string
          description: 可选；省略保持不变，空字符串表示清除（回退所选协议的默认地址）。
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
        weight:
          type: integer
          minimum: 1
          maximum: 1000
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        cooldown_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 100
    ClaudeCodeSettingsSaved:
      description: Claude Code 设置已从指定的已保存 Key 应用到运行环境的安全确认。
      type: object
      additionalProperties: false
      required: [status, target]
      properties:
        status:
          type: string
          enum: [saved]
        target:
          type: string
          enum: ["~/.claude/settings.json"]

    BilibiliCookieUpsert:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: Netscape Cookie 导出内容、Cookie 头串（SESSDATA=xxx; ...）或单个 SESSDATA 值；仅用于写入，任何响应都不会回读。

    BilibiliLoginStatus:
      type: object
      additionalProperties: false
      required:
      - state
      - message
      properties:
        state:
          type: string
          enum:
          - generating
          - waiting_scan
          - scanned
          - confirmed
          - logged_in
          - expired
          - failed
          - cancelled
        message:
          type: string
        expires_at:
          type: string
          format: date-time
        qr_image_data_url:
          type: string
          description: 登录二维码 PNG 的 data URL；不包含登录凭证
        cookie:
          $ref: '#/components/schemas/BilibiliCookieStatus'
    BilibiliCookieStatus:
      description: B 站 Cookie 的安全视图；绝不包含完整 Cookie。
      type: object
      additionalProperties: false
      required: [configured, updated_at, sessdata_expires_at, expired, masked_sessdata, cookie_count]
      properties:
        configured:
          type: boolean
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Cookie 文件最后保存时间；未配置时为 null。
        sessdata_expires_at:
          type: [string, "null"]
          format: date-time
          description: SESSDATA 本地有效期；会话级（无 expires）时为 null。
        expired:
          type: boolean
          description: SESSDATA 是否已超过本地有效期（以 B 站实际登录状态为准，检测任务可确认）。
        masked_sessdata:
          type: string
          description: 脱敏 SESSDATA（前 7 位 + 后 4 位）；未配置时为空串。
        cookie_count:
          type: integer
          minimum: 0
          description: 保存的 bilibili.com 域名 Cookie 条目数。

    KnowledgePoint:
      type: object
      additionalProperties: false
      required:
      - id
      - course_id
      - lesson_id
      - lesson_title
      - label
      - explanation
      - learning_objective
      - source_excerpt
      - importance
      - updated_at
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        lesson_title:
          type: string
        label:
          type: string
        explanation:
          type: string
        learning_objective:
          type: string
        source_excerpt:
          type: string
        importance:
          type: string
          enum:
          - core
          - supporting
        updated_at:
          type: string
          format: date-time
    KnowledgePointCollection:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePoint'
    CourseCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: 可选；省略或空白时先显示待 AI 命名，首次成功生成学习总结后自动命名。
        description:
          type: string
          maxLength: 5000
    CourseUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        archived:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1

    Course:
      type: object
      additionalProperties: false
      required: [id, title, description, archived, lesson_count, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        archived:
          type: boolean
        lesson_count:
          type: integer
          minimum: 0
        version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourseList:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    BatchDelete:
      type: object
      additionalProperties: false
      required:
      - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    LessonStatus:
      type: string
      enum: [draft, processing, ready, failed, ready_with_warning]

    LessonCreate:
      type: object
      additionalProperties: false
      required: [ordinal, title]
      properties:
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000

    LessonUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        version:
          type: integer
          format: int64
          minimum: 1

    DocumentAvailability:
      type: object
      additionalProperties: false
      required: [raw_text, student_notes, teacher_outline]
      properties:
        raw_text:
          type: boolean
        student_notes:
          type: boolean
        teacher_outline:
          type: boolean

    Lesson:
      type: object
      additionalProperties: false
      required: [id, course_id, ordinal, title, description, status, documents, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        ordinal:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/LessonStatus"
        active_job_id:
          type: [string, "null"]
          format: uuid
        documents:
          $ref: "#/components/schemas/DocumentAvailability"
        mastery:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        version:
          type: integer
