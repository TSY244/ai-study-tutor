name: contract-and-baseline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pi-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/pi-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/pi-runtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend formatting, lint, types, tests and build
        run: npm run verify

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Frontend browser tests
        run: npm run e2e

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for standard-library verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: verify-docs
        run: make verify-docs

      - name: verify-openapi
        run: make verify-openapi

      - name: test-deploy-boundaries
        run: make test-deploy-boundaries

      - name: test-legacy
        run: make test-legacy

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      # 集成测试使用嵌入式 PostgreSQL 二进制（无需 Docker），缓存避免每次下载。
      - name: Cache embedded-postgres binaries
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-v17-${{ runner.os }}

      - name: go-fmt
        run: make go-fmt

      - name: go-vet
        run: make go-vet

      - name: go-test
        run: make go-test

      - name: go-build
        run: make go-build
