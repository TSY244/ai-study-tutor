[project]
name = "ai-study-tutor"
version = "0.2.0"
description = "AI 多模态学习助教 — YouTube/B站/本地文件 → 教师教纲 + 学生笔记 + AI出题 + 答题判分 + 错题归档 + 总结测评"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TSY244" },
]
keywords = ["ai", "education", "study", "claude", "youtube", "bilibili", "quiz", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]
dependencies = [
    "openai>=1.35.0",
    "pydantic>=2.7.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "yt-dlp>=2024.0",
    "SpeechRecognition>=3.10.0",
    "pydub>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["materials*", "workspace*", "tests*", "tutor*"]
